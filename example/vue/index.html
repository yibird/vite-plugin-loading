<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <script>
      ;(() => {
        const root = document.documentElement
        const storedMode = localStorage.getItem('vite-plugin-loading:vue-theme') || 'system'
        const dark =
          storedMode === 'dark' ||
          (storedMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
        root.style.setProperty(
          '--example-primary',
          localStorage.getItem('vite-plugin-loading:vue-color') || '#00c781',
        )
        root.style.setProperty('--vue-loader-mask-color', dark ? '#101714' : '#fff')
      })()
    </script>
    <title>Vue Loading 示例</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
