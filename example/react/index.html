<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f4" />
    <script>
      ;(() => {
        const root = document.documentElement
        const storedMode = localStorage.getItem('vite-plugin-loading:react-theme') || 'system'
        const dark =
          storedMode === 'dark' ||
          (storedMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
        root.style.setProperty(
          '--example-primary',
          localStorage.getItem('vite-plugin-loading:react-color') || '#ffb300',
        )
        root.style.setProperty('--react-loader-mask-color', dark ? '#101316' : '#fff')
      })()
    </script>
    <title>React Loading 示例</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
