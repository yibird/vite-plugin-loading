<style>
  :root {
    --app-loader-ink: #f7f7f2;
    --app-loader-accent: #d5ff45;
  }
  .loading-scene {
    display: grid;
    gap: 18px;
    place-items: center;
    width: 100%;
    height: 100%;
    color: var(--app-loader-ink);
    background: #101411;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .loading-mark {
    width: 52px;
    height: 52px;
    border: 3px solid rgba(247, 247, 242, 0.24);
    border-top-color: var(--app-loader-accent);
    border-radius: 50%;
    animation: app-loading-spin 0.8s linear infinite;
  }
  .loading-label {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(247, 247, 242, 0.68);
  }
  @keyframes app-loading-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
<div class="loading-scene">
  <div class="loading-mark" aria-hidden="true"></div>
  <p class="loading-label">Preparing interface</p>
</div>
